# Builds ClaudePanel for macOS (one universal app: Apple silicon and Intel) and
# adds it to a release that app/release.ps1 already published from Windows:
# the .dmg to download, the signed .app.tar.gz for updates, and its entries
# in latest.json. release.ps1 starts it; it can also be run by hand.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (claudepanel-v2.key) and its _PASSWORD,
# RELEASES_TOKEN (a token that can write to the releases repository).
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published from Windows, e.g. 2.2.7"
        required: true

env:
  REPO: Nthhh92/ClaudePanel-releases
  VERSION: ${{ inputs.version }}

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version attendue sous la forme 2.1.0"; exit 1; }
          gh release view "v$VERSION" --repo "$REPO" > /dev/null
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # release.ps1 sets the version in these files on Windows; the commit may not be pushed yet
      - name: Set the version
        working-directory: app
        run: |
          sed -i '' -E "1,10 s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json package.json
          sed -i '' -E "1,5 s/^version = \"[^\"]+\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish
        run: |
          bundle=app/src-tauri/target/universal-apple-darwin/release/bundle
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          cp "$bundle/macos/ClaudePanel.app.tar.gz" "$out/ClaudePanel_${VERSION}_universal.app.tar.gz"
          cp "$bundle"/dmg/*.dmg "$out/ClaudePanel_${VERSION}_universal.dmg"
          sig=$(cat "$bundle/macos/ClaudePanel.app.tar.gz.sig")
          url="https://github.com/$REPO/releases/download/v$VERSION/ClaudePanel_${VERSION}_universal.app.tar.gz"

          # Same update for both Mac processors, next to the Windows entry
          # latest.json is public: no token needed to read it
          curl -fsSL -o "$RUNNER_TEMP/latest.json" "https://github.com/$REPO/releases/download/v$VERSION/latest.json"
          jq --arg sig "$sig" --arg url "$url" \
            '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}
             | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}' \
            "$RUNNER_TEMP/latest.json" > "$out/latest.json"

          gh release upload "v$VERSION" --repo "$REPO" --clobber \
            "$out/ClaudePanel_${VERSION}_universal.app.tar.gz" \
            "$out/ClaudePanel_${VERSION}_universal.dmg" \
            "$out/latest.json"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
